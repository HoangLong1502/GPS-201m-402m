plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("org.jetbrains.kotlin.plugin.compose")
}

def envFile = rootProject.file("../.env")
def apiBaseUrl = "http://192.168.100.133:3000"
def mapsApiKey = ""

if (envFile.exists()) {
    envFile.eachLine { line ->
        if (line.startsWith("EXPO_PUBLIC_API_URL=")) {
            apiBaseUrl = line.substring("EXPO_PUBLIC_API_URL=".length()).trim()
        }
    }
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
if (localProps.getProperty("GPS_API_URL")) {
    apiBaseUrl = localProps.getProperty("GPS_API_URL")
}
if (localProps.getProperty("MAPS_API_KEY")) {
    mapsApiKey = localProps.getProperty("MAPS_API_KEY")
}

android {
    namespace "com.longvhse192032.gpsracer"
    compileSdk 35

    defaultConfig {
        applicationId "com.longvhse192032.gpsracer"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.0.1"

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        manifestPlaceholders["MAPS_API_KEY"] = mapsApiKey
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2024.12.01")

    implementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.core:core-ktx:1.15.0"

    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.google.android.gms:play-services-maps:19.0.0"
    implementation "com.google.maps.android:maps-compose:6.2.1"

    implementation "io.coil-kt:coil-compose:2.7.0"

    debugImplementation "androidx.compose.ui:ui-tooling"
}
