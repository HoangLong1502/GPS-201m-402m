databases:
  - name: gps-db
    plan: free
    databaseName: gps
    user: gps_user

services:
  - type: web
    name: gps-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: gps-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
